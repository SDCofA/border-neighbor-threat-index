name: BNTI Intelligence Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'bnti_data.js'
      - 'bnti_data.json'
      - 'bnti_history.csv'
  schedule:
    # GitHub schedules are best-effort. Hourly checks give the two-hour publication target headroom.
    - cron: '17 * * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip analyzer and deploy current main branch contents'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bnti-intelligence-update
  cancel-in-progress: false

jobs:
  update-intelligence:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Feed Data
      uses: actions/cache@v4
      id: cache-feed
      with:
        path: ~/.cache/bnti
        key: bnti-feed-cache-${{ runner.os }}-${{ github.ref }}
        restore-keys: |
          bnti-feed-cache-${{ runner.os }}-

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Quality Gates
      run: python -m pytest -q

    - name: Run BNTI Analyzer
      run: python borderneighboursthreatindex.py
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_API_KEY_BACKUP: ${{ secrets.OPENROUTER_API_KEY_BACKUP }}
        OPENROUTER_MODEL: openrouter/free

    - name: Verify Fresh Snapshot
      run: python scripts/check_snapshot_health.py bnti_data.json --max-age-minutes 20

    - name: Commit Updated Data
      shell: bash
      run: |
        set -euo pipefail
        git config user.name 'bnti-update-bot'
        git config user.email 'bnti-update-bot@users.noreply.github.com'
        git add -- bnti_data.js bnti_history.csv bnti_data.json
        if git diff --cached --quiet; then
          echo "Validated run produced no data change."
          exit 0
        fi
        TIMESTAMP=$(date +'%Y-%m-%d %H:%M UTC')
        git commit -m "INTEL UPDATE: ${TIMESTAMP}"
        for i in 1 2 3 4 5; do
          git pull --rebase origin main
          if git push origin HEAD:main; then
            exit 0
          fi
          if [ "$i" -eq 5 ]; then
            echo "Push failed after five attempts" >&2
            exit 1
          fi
          sleep 10
        done

  deploy-pages:
    needs: update-intelligence
    if: ${{ always() && (github.event_name == 'push' || needs.update-intelligence.result == 'success' || needs.update-intelligence.result == 'skipped') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Pull Latest
        run: git pull origin main
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true

      - name: Retry delayed Pages activation
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5

      - name: Verify public snapshot
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://sdcofa.github.io/border-neighbor-threat-index/bnti_data.json?run=${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/bnti-live.json && \
              python scripts/check_snapshot_health.py /tmp/bnti-live.json --max-age-minutes 480; then
              exit 0
            fi
            sleep 15
          done
          echo "Published snapshot did not pass the freshness contract" >&2
          exit 1
