name: BNTI Intelligence Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'bnti_data.js'
      - 'bnti_data.json'
      - 'bnti_history.csv'
  schedule:
    # Run every 2 hours at minute 0
    - cron: '0 */2 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip analyzer and deploy current main branch contents'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bnti-intelligence-update
  cancel-in-progress: false

jobs:
  update-intelligence:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Feed Data
      uses: actions/cache@v4
      id: cache-feed
      with:
        path: ~/.cache/bnti
        key: bnti-feed-cache-${{ runner.os }}-${{ github.ref }}
        restore-keys: |
          bnti-feed-cache-${{ runner.os }}-

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Product Contracts
      run: python -m pytest -q

    - name: Run BNTI Analyzer
      run: python borderneighboursthreatindex.py
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_API_KEY_BACKUP: ${{ secrets.OPENROUTER_API_KEY_BACKUP }}
        OPENROUTER_MODEL: openrouter/free

    - name: Commit Updated Data
      run: |
        git config --global user.name 'akgularda'
        git config --global user.email 'akgularda@users.noreply.github.com'
        
        git add bnti_data.js bnti_history.csv bnti_data.json
        
        TIMESTAMP=$(date +'%Y-%m-%d %H:%M UTC')
        git diff --cached --quiet || git commit -m "INTEL UPDATE: ${TIMESTAMP}"
        
        pushed=false
        for i in 1 2 3 4 5; do
          git pull --rebase origin main
          if git push; then
            pushed=true
            break
          fi
          sleep 10
        done
        test "$pushed" = true

  deploy-pages:
    needs: update-intelligence
    if: ${{ always() && (needs.update-intelligence.result == 'success' || needs.update-intelligence.result == 'skipped') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Pull Latest
        run: git pull origin main
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
